name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build native tun2socks engine (hev-socks5-tunnel)
        run: |
          mkdir -p jni
          git clone --recursive --depth 1 --branch 2.17.1 https://github.com/heiher/hev-socks5-tunnel jni/hev-socks5-tunnel
          printf 'include $(call all-subdir-makefiles)\n' > jni/Android.mk
          printf 'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64\nAPP_PLATFORM := android-24\n' > jni/Application.mk
          "$ANDROID_HOME/ndk/26.1.10909125/ndk-build"
          mkdir -p app/src/main/jniLibs
          cp -r libs/* app/src/main/jniLibs/
          ls -R app/src/main/jniLibs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SadeSocks-apk
          path: app/build/outputs/apk/debug/*.apk
